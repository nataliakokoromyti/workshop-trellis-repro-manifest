cvm-version: 0.7.5
cpus: 128
memory: 1966080
gpus: 8

models:
  - name: "kimi-k2-thinking"
    repo: "moonshotai/Kimi-K2-Thinking@a51ccc050d73dab088bf7b0e2dd9b30ae85a4e55"
    mpk: "95432fc61107d9bb7472a048c686505a54b0e3205a050e2fa781ddfe2330893e_594256601088_f19e7117-6b40-53fe-af43-f9a57cb0ec2f"
  - name: "kimi-k2-6"
    repo: "moonshotai/Kimi-K2.6@7eb5002f6aadc958aed6a9177b7ed26bb94011bb"
    mpk: "baf763c7922bbafd337dc3aa86c9059f694169c51b1e0197d0d441aeea51186c_595205046272_7b0f3f16-bf8d-5206-8d14-088929943faf"

containers:
  - name: workshop-yoda-benchmark
    image: ghcr.io/lucid-computing-labs/workshop-trellis-repro:benchmark-cu128-torch28
    runtime: nvidia
    gpus: all
    ipc: host
    volumes:
      - /mnt/ramdisk/workspace:/workspace
    env:
      - PORT: "8000"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -euo pipefail
        mkdir -p /workspace/tinfoil-jobs
        python3 - <<'PY'
        import json
        import os
        import subprocess
        import threading
        import time
        import uuid
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from pathlib import Path
        from urllib.parse import urlparse

        root = Path("/workspace/tinfoil-jobs")
        jobs = {}

        def now():
            return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

        class Handler(BaseHTTPRequestHandler):
            def _send(self, status, payload):
                body = json.dumps(payload, sort_keys=True).encode()
                self.send_response(status)
                self.send_header("content-type", "application/json")
                self.send_header("content-length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                path = urlparse(self.path).path
                if path == "/health":
                    self._send(200, {"ok": True, "time": now()})
                    return
                if path == "/gpus":
                    out = subprocess.run(
                        [
                            "nvidia-smi",
                            "--query-gpu=index,name,memory.used,memory.total,utilization.gpu",
                            "--format=csv,noheader,nounits",
                        ],
                        text=True,
                        stdout=subprocess.PIPE,
                        stderr=subprocess.STDOUT,
                    )
                    self._send(200, {"returncode": out.returncode, "output": out.stdout})
                    return
                if path == "/jobs":
                    self._send(200, {"jobs": sorted(jobs.values(), key=lambda item: item["created_at"])})
                    return
                if path.startswith("/jobs/"):
                    job_id = path.rsplit("/", 1)[-1]
                    job = jobs.get(job_id)
                    if job is None:
                        self._send(404, {"error": "unknown job"})
                        return
                    proc = job.get("proc")
                    if proc is not None:
                        rc = proc.poll()
                        if rc is not None:
                            job["returncode"] = rc
                            job["finished_at"] = job.get("finished_at") or now()
                            job["proc"] = None
                    log_path = Path(job["log_path"])
                    tail = ""
                    if log_path.exists():
                        data = log_path.read_bytes()[-65536:]
                        tail = data.decode(errors="replace")
                    public = {k: v for k, v in job.items() if k != "proc"}
                    public["tail"] = tail
                    public["running"] = job.get("proc") is not None
                    self._send(200, public)
                    return
                self._send(404, {"error": "not found"})

            def do_POST(self):
                path = urlparse(self.path).path
                if path != "/jobs":
                    self._send(404, {"error": "not found"})
                    return
                length = int(self.headers.get("content-length", "0"))
                try:
                    payload = json.loads(self.rfile.read(length) or b"{}")
                    cmd = payload["cmd"]
                except Exception as exc:
                    self._send(400, {"error": f"bad request: {exc}"})
                    return
                job_id = payload.get("id") or uuid.uuid4().hex[:12]
                cwd = payload.get("cwd") or "/workspace"
                env = os.environ.copy()
                env.update({str(k): str(v) for k, v in payload.get("env", {}).items()})
                log_path = root / f"{job_id}.log"
                log_file = log_path.open("wb")
                proc = subprocess.Popen(
                    ["bash", "-lc", cmd],
                    cwd=cwd,
                    env=env,
                    stdout=log_file,
                    stderr=subprocess.STDOUT,
                    stdin=subprocess.DEVNULL,
                    start_new_session=True,
                )
                job = {
                    "id": job_id,
                    "cmd": cmd,
                    "cwd": cwd,
                    "created_at": now(),
                    "log_path": str(log_path),
                    "returncode": None,
                    "finished_at": None,
                    "proc": proc,
                }
                jobs[job_id] = job

                def reap():
                    rc = proc.wait()
                    log_file.close()
                    job["returncode"] = rc
                    job["finished_at"] = now()
                    job["proc"] = None

                threading.Thread(target=reap, daemon=True).start()
                public = {k: v for k, v in job.items() if k != "proc"}
                public["running"] = True
                self._send(202, public)

            def log_message(self, fmt, *args):
                return

        ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), Handler).serve_forever()
        PY

shim:
  upstream-port: 8000
  paths:
    - /health
    - /gpus
    - /jobs/*
