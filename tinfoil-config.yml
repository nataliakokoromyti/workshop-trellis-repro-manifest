cvm-version: 0.7.1
cpus: 16
memory: 65536
gpus: 8

containers:
  - name: api
    image: ghcr.io/nataliakokoromyti/workshop-trellis-repro:0.3.34
    runtime: nvidia
    gpus: all
    ipc: host
    env:
      - PORT: "8080"
      - CONFIG_PATH: "/app/configs/trellis_kimi_k2.yaml"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - TRELLIS_EXPERT_GROUP_CHUNK_SIZE: "2048"
      - TRELLIS_EXPERT_TOKEN_CHUNK_SIZE: "2048"
      - TRELLIS_LINEAR_CHUNK_SIZE: "2048"
      - TRELLIS_ROUTING_CHUNK_SIZE: "2048"
    command:
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

shim:
  upstream-port: 8080
  paths:
    - /health
    - /gpus
    - /smoke/env
    - /smoke/dist
    - /smoke/forward
    - /smoke/train-step
    - /benchmark/step
    - /trellis/env
    - /trellis/forward
    - /trellis/train-step
    - /trellis/benchmark
    - /trellis/baseline/forward
    - /trellis/baseline/train-step
    - /trellis/baseline/benchmark
    - /trellis/baseline/profile
    - /trellis/yoda/train-step
    - /trellis/yoda/benchmark
    - /trellis/yoda/profile
    - /jobs/*
