cvm-version: 0.7.1
cpus: 16
memory: 65536
gpus: 8

containers:
  - name: api
    image: ghcr.io/nataliakokoromyti/workshop-trellis-repro:0.3.19@sha256:4bff8923f1281990186716439e2778d5600f9e3802e8817ca2ed9a460164fb0d
    runtime: nvidia
    gpus: all
    ipc: host
    env:
      - PORT: "8080"
      - CONFIG_PATH: "/app/configs/trellis_kimi_k2.yaml"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    command:
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

shim:
  upstream-port: 8080
  paths:
    - /health
    - /gpus
    - /smoke/env
    - /smoke/dist
    - /smoke/forward
    - /smoke/train-step
    - /benchmark/step
    - /trellis/env
    - /trellis/forward
    - /trellis/train-step
    - /trellis/benchmark
    - /trellis/yoda/train-step
    - /trellis/yoda/benchmark
    - /jobs/*
