cvm-version: 0.7.5
cpus: 32
memory: 524288
gpus: 8

containers:
  - name: api
    image: ghcr.io/lucid-computing-labs/tinfoil-h200-cc:v0.1.1@sha256:7c2785543bf93b8a73b7516e378b38bfced0165763d0bc633e711c7a9e4b4221
    runtime: nvidia
    gpus: all
    ipc: host
    env:
      - PORT: "8080"
      - EXPECTED_GPUS: "8"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080"]

shim:
  upstream-port: 8080
  paths:
    - /health
    - /gpus
    - /
