cvm-version: 0.7.1
cpus: 16
memory: 65536
gpus: 8

containers:
  - name: api
    image: ghcr.io/nataliakokoromyti/workshop-trellis-repro:0.3.3@sha256:d7db545a6e2d01ab01c13ba05435760731e55e882beea0c02c3b9ba1b756457b
    runtime: nvidia
    gpus: all
    ipc: host
    env:
      - PORT: "8080"
      - CONFIG_PATH: "/app/configs/trellis_kimi_k2.yaml"
    command:
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

shim:
  upstream-port: 8080
  paths:
    - /health
    - /gpus
    - /smoke/env
    - /smoke/dist
    - /smoke/forward
    - /smoke/train-step
    - /benchmark/step
    - /trellis/env
    - /trellis/forward
    - /trellis/train-step
    - /trellis/benchmark
    - /trellis/yoda/train-step
    - /trellis/yoda/benchmark
