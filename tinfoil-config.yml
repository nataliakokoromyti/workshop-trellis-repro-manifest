cvm-version: 0.7.5
cpus: 128
memory: 1966080
gpus: 8

models:
  - name: "primary-model"
    repo: "moonshotai/Kimi-K2-Thinking@a51ccc050d73dab088bf7b0e2dd9b30ae85a4e55"
    mpk: "95432fc61107d9bb7472a048c686505a54b0e3205a050e2fa781ddfe2330893e_594256601088_f19e7117-6b40-53fe-af43-f9a57cb0ec2f"

containers:
  - name: ml-training
    image: ghcr.io/nataliakokoromyti/workshop-trellis-repro@sha256:e9981e7e09473fc5c7a376171a861862f331b2f14dc98b7ebc88417b6cc67413
    runtime: nvidia
    gpus: all
    ipc: host
    volumes:
      - /mnt/ramdisk/workspace:/workspace
    env:
      - PORT: "8080"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        mkdir -p /workspace /models
        ln -sfn /tinfoil/mpk/mpk-95432fc61107d9bb7472a048c686505a54b0e3205a050e2fa781ddfe2330893e /models/primary-model
        exec uvicorn app:app --host 0.0.0.0 --port 8080

shim:
  upstream-port: 8080
  paths:
    - /health
    - /gpus
    - /jobs/*
