cvm-version: 0.7.5
cpus: 128
memory: 1966080
gpus: 8

models:
  - name: "kimi-k2-thinking"
    repo: "moonshotai/Kimi-K2-Thinking@a51ccc050d73dab088bf7b0e2dd9b30ae85a4e55"
    mpk: "95432fc61107d9bb7472a048c686505a54b0e3205a050e2fa781ddfe2330893e_594256601088_f19e7117-6b40-53fe-af43-f9a57cb0ec2f"
  - name: "kimi-k2-6"
    repo: "moonshotai/Kimi-K2.6@7eb5002f6aadc958aed6a9177b7ed26bb94011bb"
    mpk: "baf763c7922bbafd337dc3aa86c9059f694169c51b1e0197d0d441aeea51186c_595205046272_7b0f3f16-bf8d-5206-8d14-088929943faf"

containers:
  - name: workshop-yoda-benchmark
    image: ghcr.io/lucid-computing-labs/workshop-trellis-repro:benchmark-cu128-torch28
    runtime: nvidia
    gpus: all
    ipc: host
    volumes:
      - /mnt/ramdisk/workspace:/workspace
    env:
      - PORT: "8000"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    entrypoint:
      - python3
      - -u
      - -c
    command:
      - 'exec("import json,os,subprocess,threading,time,uuid\nfrom http.server import BaseHTTPRequestHandler,ThreadingHTTPServer\nfrom pathlib import Path\nroot=Path(''/workspace/tinfoil-jobs''); root.mkdir(parents=True,exist_ok=True); jobs={}\ndef now(): return time.strftime(''%Y-%m-%dT%H:%M:%SZ'',time.gmtime())\nclass H(BaseHTTPRequestHandler):\n def sendj(self,c,p):\n  b=json.dumps(p,sort_keys=True).encode(); self.send_response(c); self.send_header(''content-type'',''application/json''); self.send_header(''content-length'',str(len(b))); self.end_headers(); self.wfile.write(b)\n def do_GET(self):\n  p=self.path.split(''?'',1)[0]\n  if p==''/health'': return self.sendj(200,{''ok'':True,''time'':now()})\n  if p==''/gpus'':\n   o=subprocess.run([''nvidia-smi'',''--query-gpu=index,name,memory.used,memory.total,utilization.gpu'',''--format=csv,noheader,nounits''],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT); return self.sendj(200,{''returncode'':o.returncode,''output'':o.stdout})\n  if p==''/jobs'': return self.sendj(200,{''jobs'':[{k:v for k,v in j.items() if k!=''proc''}|{''running'':j.get(''proc'') is not None} for j in jobs.values()]})\n  if p.startswith(''/jobs/''):\n   j=jobs.get(p.rsplit(''/'',1)[-1])\n   if not j: return self.sendj(404,{''error'':''unknown job''})\n   pr=j.get(''proc'')\n   if pr and pr.poll() is not None: j[''returncode'']=pr.returncode; j[''finished_at'']=j.get(''finished_at'') or now(); j[''proc'']=None\n   lp=Path(j[''log_path'']); tail=lp.read_bytes()[-65536:].decode(errors=''replace'') if lp.exists() else ''''\n   return self.sendj(200,{k:v for k,v in j.items() if k!=''proc''}|{''running'':j.get(''proc'') is not None,''tail'':tail})\n  return self.sendj(404,{''error'':''not found''})\n def do_POST(self):\n  if self.path.split(''?'',1)[0]!=''/jobs'': return self.sendj(404,{''error'':''not found''})\n  try: q=json.loads(self.rfile.read(int(self.headers.get(''content-length'',''0''))) or b''{}''); cmd=q[''cmd'']\n  except Exception as e: return self.sendj(400,{''error'':str(e)})\n  jid=q.get(''id'') or uuid.uuid4().hex[:12]; cwd=q.get(''cwd'') or ''/workspace''; env=os.environ.copy(); env.update({str(k):str(v) for k,v in q.get(''env'',{}).items()}); lp=root/(jid+''.log''); f=lp.open(''wb''); pr=subprocess.Popen([''bash'',''-lc'',cmd],cwd=cwd,env=env,stdout=f,stderr=subprocess.STDOUT,stdin=subprocess.DEVNULL,start_new_session=True); j={''id'':jid,''cmd'':cmd,''cwd'':cwd,''created_at'':now(),''log_path'':str(lp),''returncode'':None,''finished_at'':None,''proc'':pr}; jobs[jid]=j\n  def reap():\n   rc=pr.wait(); f.close(); j[''returncode'']=rc; j[''finished_at'']=now(); j[''proc'']=None\n  threading.Thread(target=reap,daemon=True).start(); return self.sendj(202,{k:v for k,v in j.items() if k!=''proc''}|{''running'':True})\n def log_message(self,*a): pass\nThreadingHTTPServer((''0.0.0.0'',int(os.environ.get(''PORT'',''8000''))),H).serve_forever()\n")'

shim:
  upstream-port: 8000
  paths:
    - /health
    - /gpus
    - /jobs/*
