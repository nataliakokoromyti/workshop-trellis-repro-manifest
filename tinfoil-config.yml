shim-version: v0.4.1@sha256:3187744b40047060b9567d4b964a394ea0f21b29f99dd371b3e1c91ecee3c196
cvm-version: 0.6.9
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "kimi-k2-thinking"
    repo: "moonshotai/Kimi-K2-Thinking@612681931a8c906ddb349f8ad0f582cb552189cd"
    mpk: "83a9b1859995ac80eba3e4d928ea04d1aaa6f855ed80f32eb75098526c272f2d_594256601088_69ba6dc2-989f-56d7-8ea2-db7d537f3725"

containers:
  - name: api
    image: ghcr.io/nataliakokoromyti/workshop-trellis-repro:latest
    runtime: nvidia
    gpus: all
    ipc: host
    volumes:
      - /mnt/ramdisk/workspace:/workspace
    env:
      - PORT: "8080"
      - CONFIG_PATH: "/app/configs/trellis_kimi_k2.yaml"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - TRELLIS_EXPERT_GROUP_CHUNK_SIZE: "512"
      - TRELLIS_EXPERT_DEQUANT_CHUNK_SIZE: "1"
      - TRELLIS_EXPERT_TOKEN_CHUNK_SIZE: "512"
      - TRELLIS_LINEAR_CHUNK_SIZE: "512"
      - TRELLIS_ROUTING_CHUNK_SIZE: "1000000"
      - TRELLIS_CACHE_STATIC_COUNTS: "1"
      - TRELLIS_TRACE_MODE: "coarse"
      - TRELLIS_DEQUANT_TILE_ROWS: "100000000"
      - TRELLIS_EXPERT_STACK_CHUNK_SIZE: "1"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        mkdir -p /workspace /models
        cp -a /app/. /workspace/
        ln -sfn /tinfoil/mpk/mpk-83a9b1859995ac80eba3e4d928ea04d1aaa6f855ed80f32eb75098526c272f2d /models/kimi-k2-thinking
        cd /workspace
        exec uvicorn app:app --host 0.0.0.0 --port 8080

shim:
  upstream-port: 8080
  paths:
    - /health
    - /gpus
    - /smoke/env
    - /smoke/dist
    - /smoke/forward
    - /smoke/train-step
    - /benchmark/step
    - /trellis/env
    - /trellis/forward
    - /trellis/train-step
    - /trellis/benchmark
    - /trellis/benchmark-tiny
    - /trellis/baseline/forward
    - /trellis/baseline/train-step
    - /trellis/baseline/benchmark
    - /trellis/baseline/profile
    - /trellis/yoda/train-step
    - /trellis/yoda/benchmark
    - /trellis/yoda/profile
    - /trellis/yoda/baseline/train-step
    - /trellis/yoda/baseline/benchmark
    - /trellis/yoda/baseline/profile
    - /parity/kimi-k2
    - /jobs/*
