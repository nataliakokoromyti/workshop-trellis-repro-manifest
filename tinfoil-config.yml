cvm-version: 0.7.5
cpus: 8
memory: 16384
gpus: 8

containers:
  - name: api
    image: python:3.12-slim@sha256:866411c135b507754efdf2fda51484be4d3d7d5173ed53cd083106132e710904
    env:
      - PORT: "8080"
    command:
      - python
      - -u
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                body = json.dumps({"ok": True, "path": self.path}).encode()
                self.send_response(200)
                self.send_header("content-type", "application/json")
                self.send_header("content-length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *args):
                pass

        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

shim:
  upstream-port: 8080
  paths:
    - /health
    - /
