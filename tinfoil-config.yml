cvm-version: 0.7.1
cpus: 16
memory: 65536
gpus: 8

containers:
  - name: api
    image: ghcr.io/nataliakokoromyti/workshop-trellis-repro:v0.2.4@sha256:797465f25343e2362c6e119f2fceedc3daf55f0b774437998962e9f341c3b9c3
    runtime: nvidia
    gpus: all
    ipc: host
    env:
      - PORT: "8080"
      - CONFIG_PATH: "/app/configs/trellis_kimi_k2.yaml"
    command:
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

shim:
  upstream-port: 8080
  paths:
    - /health
    - /gpus
    - /smoke/env
    - /smoke/dist
    - /smoke/forward
    - /smoke/train-step
    - /benchmark/step
    - /trellis/env
    - /trellis/forward
    - /trellis/train-step
    - /trellis/benchmark
    - /trellis/yoda/train-step
    - /trellis/yoda/benchmark
