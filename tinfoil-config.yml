cvm-version: 0.7.5
cpus: 16
memory: 65536
gpus: 8

containers:
  - name: api
    image: ghcr.io/nataliakokoromyti/workshop-trellis-repro:0.3.72@sha256:76d8668b2462db2bfc7b367ad296e73bacc7508c1e17d97d655ce3a1cfa8dfd4
    runtime: nvidia
    gpus: all
    ipc: host
    volumes:
      - /mnt/ramdisk/workspace:/workspace
    env:
      - PORT: "8080"
      - CONFIG_PATH: "/app/configs/trellis_kimi_k2.yaml"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - TRELLIS_EXPERT_GROUP_CHUNK_SIZE: "512"
      - TRELLIS_EXPERT_DEQUANT_CHUNK_SIZE: "1"
      - TRELLIS_EXPERT_TOKEN_CHUNK_SIZE: "512"
      - TRELLIS_LINEAR_CHUNK_SIZE: "512"
      - TRELLIS_ROUTING_CHUNK_SIZE: "512"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        mkdir -p /workspace
        cp -a /app/. /workspace/
        cd /workspace
        exec uvicorn app:app --host 0.0.0.0 --port 8080

shim:
  upstream-port: 8080
  paths:
    - /health
    - /gpus
    - /smoke/env
    - /smoke/dist
    - /smoke/forward
    - /smoke/train-step
    - /benchmark/step
    - /trellis/env
    - /trellis/forward
    - /trellis/train-step
    - /trellis/benchmark
    - /trellis/benchmark-tiny
    - /trellis/baseline/forward
    - /trellis/baseline/train-step
    - /trellis/baseline/benchmark
    - /trellis/baseline/profile
    - /trellis/yoda/train-step
    - /trellis/yoda/benchmark
    - /trellis/yoda/profile
    - /trellis/yoda/baseline/train-step
    - /trellis/yoda/baseline/benchmark
    - /trellis/yoda/baseline/profile
    - /parity/kimi-k2
    - /jobs/*
