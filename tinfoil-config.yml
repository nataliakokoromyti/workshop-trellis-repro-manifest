cvm-version: 0.7.5
cpus: 128
memory: 1966080
gpus: 8

models:
  - name: "primary-model"
    repo: "moonshotai/Kimi-K2.6@2b2b88e33c96d813ebb4c83a740252fe08018e3a"
    mpk: "b9a191a313479bccc692491d74803b2520ae28c90bc440f9c76459d297529956_595205046272_1ea57052-e386-5369-8c4f-853663460858"

containers:
  - name: workshop-yoda-benchmark
    image: ghcr.io/lucid-computing-labs/workshop-trellis-repro:benchmark-cu128-torch28
    runtime: nvidia
    gpus: all
    ipc: host
    volumes:
      - /mnt/ramdisk/workspace:/workspace
    env:
      - PORT: "8000"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    entrypoint:
      - sleep
    command:
      - infinity

shim:
  upstream-port: 8000
  paths:
    - /health
    - /gpus
    - /jobs/*
